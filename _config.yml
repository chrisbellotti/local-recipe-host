title: Our Recipe Box
description: Recipes we actually cook.

# If this repo is NOT named <username>.github.io, set baseurl to "/<repo-name>".
baseurl: "/local-recipe-host"
url: "https://chrisbellotti.github.io"

collections:
  recipes:
    output: true
    permalink: /recipes/:name/

defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe

markdown: kramdown
exclude:
  - README.md
  - CLAUDE.md
  - .claude
